# Local PostgreSQL only. Dokploy builds the root Dockerfile and uses its
# separately managed private PostgreSQL service through DATABASE_URL.
services:
  postgres:
    image: postgres:18
    container_name: cactus-postgres
    restart: unless-stopped
    user: "1000:1000"
    environment:
      PGDATA: /var/lib/postgresql/data
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - hba_file=/etc/postgresql/cactus-pg_hba.conf
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/cactus-pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -d cactus -U cactus"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
