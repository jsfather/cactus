name: Deploy Cactus to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://la.ecactus.co/api' }}
  NEXT_PUBLIC_STATIC_BASE_URL: ${{ vars.NEXT_PUBLIC_STATIC_BASE_URL || 'https://la.ecactus.co' }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Ubuntu Server
        uses: appleboy/ssh-action@v1.0.0
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ env.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_STATIC_BASE_URL: ${{ env.NEXT_PUBLIC_STATIC_BASE_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          port: 9011
          envs: NEXT_PUBLIC_API_BASE_URL,NEXT_PUBLIC_STATIC_BASE_URL
          script: |
            cd /opt/cactus
            touch .env.production
            sed -i '/^NEXT_PUBLIC_API_BASE_URL=/d; /^NEXT_PUBLIC_STATIC_BASE_URL=/d' .env.production
            printf 'NEXT_PUBLIC_API_BASE_URL=%s\n' "$NEXT_PUBLIC_API_BASE_URL" >> .env.production
            printf 'NEXT_PUBLIC_STATIC_BASE_URL=%s\n' "$NEXT_PUBLIC_STATIC_BASE_URL" >> .env.production
            git pull origin main
            docker compose build --no-cache
            docker compose up -d
            docker image prune -f
