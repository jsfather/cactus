services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://la.ecactus.co/api}
        NEXT_PUBLIC_STATIC_BASE_URL: ${NEXT_PUBLIC_STATIC_BASE_URL:-https://la.ecactus.co}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://la.ecactus.co}
        NEXT_BUILD_MAX_OLD_SPACE_SIZE: ${NEXT_BUILD_MAX_OLD_SPACE_SIZE:-384}
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://la.ecactus.co/api}
      NEXT_PUBLIC_STATIC_BASE_URL: ${NEXT_PUBLIC_STATIC_BASE_URL:-https://la.ecactus.co}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://la.ecactus.co}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
